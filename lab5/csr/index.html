<html>
    <head>
        <meta charset="utf-8"/>
        <title>Категорії</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">    
    </head>
    <body>
        <div class="container" id="loginContainer">
            <h1>Форма входу</h1>
            <div class="row">
                <form method="POST" id="loginForm">
                        <p>
                            <input type="text" name="login" value="" class="form-control" placeholder="Логін" required/>
                        </p>
                        <p>
                            <input type="password" name="password" value="" class="form-control" placeholder="Пароль" required/>
                        </p>
                        <p>
                            <button class="btn btn-success" type="submit">Увійти</button>
                        </p>
                        <p class="text-danger" id="loginError"></p>
                    </form>
            </div>
        </div>
        <div class="container" id="contentContainer">
            <ul class="nav">
                <li><a class="btn btn-outline nav-btn" href="#" data-target="#categoryContent">Категорії</a></li>
                <li><a class="btn btn-outline nav-btn" href="#" data-target="#propertyContent">Характеристики</a></li>
                <li><a class="btn btn-outline nav-btn" href="#" data-target="#backpackContent">Рюкзаки</a></li>
                <li><a class="btn btn-outline nav-btn" id="logoutBtn" href="#">Вийти</a></li>
            </ul>
            <div class="tab-content" id="categoryContent">
                <h1>Категорії</h1>
                <div class="row">
                    <div class="col-md-8">
                        <table class="table" id="categoryTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Назва</th>
                                    <th>Дії</th>
                                </tr>
                            </thead>
                            <tbody>
                                
                            </tbody>
                        </table>
                    </div>
                    <div class="col-md-4">
                        <form method="POST" id="categoryForm">
                            <p>
                                <input type="text" name="name" value="" class="form-control" placeholder="Назва категорії" required/>
                            </p>
                            <p>
                                <input type="hidden" name="id" value=""/>
                                <button class="btn btn-success" type="submit">Зберегти</button>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
            <div class="tab-content" id="propertyContent">
                <h1>Характеристики</h1>
                <div class="row">
                    <div class="col-md-8">
                        <table class="table" id="propertyTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Назва</th>
                                    <th>Одиниці вимірювання</th>
                                    <th>Дії</th>
                                </tr>
                            </thead>
                            <tbody>
                                
                            </tbody>
                        </table>
                    </div>
                    <div class="col-md-4">
                        <form method="POST" id="propertyForm">
                            <p>
                                <input type="text" name="name" value="" class="form-control" placeholder="Назва характеристики" required/>
                            </p>
                            <p>
                            <input type="text" name="units" value="" class="form-control" placeholder="Одиниці вимірювання" required/>
                        </p>
                            <p>
                                <input type="hidden" name="id" value=""/>
                                <button class="btn btn-success" type="submit">Зберегти</button>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
            <div class="tab-content" id="backpackContent">
                <h1>Рюкзаки</h1>
                <div class="row">
                    <div class="col-md-8">
                        <table class="table" id="backpackTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Виробник</th>
                                    <th>Модель</th>
                                    <th>Категорія</th>
                                    <th>Ціна</th>
                                    <th>Характеристики</th>
                                    <th>Дії</th>
                                </tr>
                            </thead>
                            <tbody>
                                
                            </tbody>
                        </table>
                    </div>
                    <div class="col-md-4">
                        <form method="POST" id="backpackForm">
                            <p>
                                <input type="text" name="vendor" value="" class="form-control" placeholder="Виробник" required/>
                            </p>
                            <p>
                                <input type="text" name="model" value="" class="form-control" placeholder="Модель" required/>
                            </p>
                            <p>
                                <input type="text" name="category" value="" class="form-control" placeholder="Категорія" required/>
                            </p>
                            <p>
                                <input type="text" name="price" value="" class="form-control" placeholder="Ціна" required/>
                            </p>
                            <p>
                                <input type="text" name="properties" value='' class="form-control" placeholder="Характеристики" required/>
                            </p>
                            <p>
                                <input type="hidden" name="id" value=""/>
                                <button class="btn btn-success" type="submit">Зберегти</button>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="./main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</html>
