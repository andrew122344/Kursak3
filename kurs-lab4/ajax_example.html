<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
    </head>
    <body>
        <div id="content">

        </div>
    </body>
    <script>
        fetch('http://localhost/Kursak/kurs-lab4/api/getSunScreensAsJSON.php')
  .then(response => response.json()) // or response.text(), etc.
  .then(data => {
    let content=``;
    for (let i=0;i<data.sunScreens.length;i++){
        content+=`
            Сонцезахисний засіб `+data.sunScreens[i].vendor+` `+data.sunScreens[i].name+`</br>
            Ціна: `+data.sunScreens[i].price+`</br>
            Час застосування: `+data.sunScreens[i].applTime+`</br>
            Сфера застосування: `+data.sunScreens[i].sphrofAppl+`</br>
            Характеристики: </br>
        `;
        console.log(content);
        for (const key in data.sunScreens[i].properties) {
            content+=`${key}: ${data.sunScreens[i].properties[key]} </br>`;
        }
        
    }
    document.getElementById('content').innerHTML=content;
  })
  .catch(error => console.error('Error:', error));
    </script>
</html>
